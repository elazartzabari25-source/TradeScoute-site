<style>
  :root{
    --ink:#e9f1f6; --dim:#8fa3b0; --ground:#03070c; --panel:#0b1119;
    --line:rgba(160,220,235,.14); --glass:rgba(255,255,255,.07);
    --c1:#2f6bff; --c2:#26a69a; --c3:#ff6ec7;
    --c:var(--c1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overscroll-behavior:none;overscroll-behavior-x:none}
  body{font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;direction:rtl;
    display:flex;flex-direction:column;overflow:hidden}

  /* ---------- top bar ---------- */
  .top{position:relative;z-index:30;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:10px 16px calc(10px);background:linear-gradient(#03070c,rgba(3,7,12,.55) 70%,transparent)}
  .mark{display:flex;align-items:center;gap:9px;min-width:0}
  .mark img{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:#000;object-fit:cover;display:block}
  .mark b{font-family:"Unbounded","Heebo",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em;direction:ltr}
  .stamp{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--dim);direction:ltr;white-space:nowrap}

  /* ---------- category rail ---------- */
  .tabs{position:relative;z-index:30;flex:0 0 auto;display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;
    scrollbar-width:none;background:linear-gradient(rgba(3,7,12,.55),transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);color:var(--dim);
    font:500 13px/1 "Heebo",sans-serif;padding:9px 13px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:color .25s,border-color .25s,background .25s}
  .tabs button .sw{width:7px;height:7px;border-radius:50%;background:currentColor}
  .tabs button[aria-current="true"]{color:#fff;border-color:color-mix(in srgb,var(--tc) 70%,transparent);
    background:color-mix(in srgb,var(--tc) 22%,transparent)}
  .tabs button[aria-current="true"] .sw{background:var(--tc)}
  .tabs button:focus-visible{outline:2px solid var(--tc);outline-offset:2px}

  /* ---------- feed ---------- */
  .feed{flex:1 1 auto;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .feed::-webkit-scrollbar{display:none}
  .slide{position:relative;height:100%;scroll-snap-align:center;scroll-snap-stop:always;
    display:grid;place-items:center;padding:6px 16px 36px;isolation:isolate}
  .glow{position:absolute;inset:6% 12%;border-radius:50%;z-index:-1;filter:blur(70px);opacity:.42;
    background:radial-gradient(circle at 50% 45%,var(--c),transparent 70%);transition:opacity .6s}

  .card{position:relative;height:100%;aspect-ratio:1/2;max-width:100%;perspective:1600px;user-select:none;-webkit-user-select:none;
    transform:scale(.94);opacity:.5;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:pan-y}
  .slide.live .card{transform:scale(1);opacity:1}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.25,1.25,.4,1);will-change:transform}
  .flip.drag{transition:none}
  .face{position:absolute;inset:0;border-radius:26px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 60%,#ffffff40),0 26px 60px rgba(0,0,0,.65);transition:box-shadow .55s}
  .slide.live .face{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 75%,white),0 0 46px color-mix(in srgb,var(--c) 35%,transparent),0 26px 60px rgba(0,0,0,.7)}
  .face.back{transform:rotateY(180deg);background:#fff}
  .face img{width:100%;height:100%;display:block;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none;
    transition:filter .6s}
  .card.locked .front img{filter:brightness(.3) saturate(.45) blur(3px)}
  /* door shading: darkens a face as it turns edge-on */
  .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:#000;opacity:var(--shade,0)}

  /* which side is showing */
  .sides{position:absolute;top:12px;left:12px;z-index:6;display:flex;gap:4px;padding:4px;border-radius:99px;
    background:rgba(8,14,20,.55);backdrop-filter:blur(6px);direction:rtl;pointer-events:none;opacity:0;transition:opacity .4s}
  .slide.live .sides{opacity:1}
  .card.locked .sides{opacity:0}
  .sides span{font-size:11px;line-height:1;padding:5px 8px;border-radius:99px;color:#9fb1bd;transition:background .3s,color .3s}
  .card:not(.flipped) .sides .g,.card.flipped .sides .t{background:var(--c);color:#fff}

  /* ---------- card actions (outside the flip, so they stay put on both sides) ---------- */
  .acts{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:6px;opacity:0;transition:opacity .4s}
  .slide.live .acts{opacity:1}
  .card.locked .acts{opacity:0;pointer-events:none}
  .turn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(8,14,20,.6);
    backdrop-filter:blur(6px);color:var(--dim);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;
    transition:color .25s,transform .25s,border-color .25s}
  .turn{color:#dbe6ec}
  .turn:focus-visible{outline:2px solid var(--c);outline-offset:3px}

  /* ---------- lock ---------- */
  .lock{position:absolute;inset:0;z-index:5;border:0;padding:0;background:none;cursor:pointer;
    display:grid;place-items:center;gap:0;transition:opacity .45s}
  .lock .body{width:42%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
    transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
  .lock svg{width:100%;height:auto;display:block;overflow:visible}
  .lock .shackle{transition:transform .35s ease}
  .lock .say{position:absolute;left:50%;top:calc(50% + 24%);transform:translateX(-50%);
    font-size:13px;color:#cdd9e0;letter-spacing:.02em;white-space:nowrap}
  .lock:hover .body{transform:scale(1.06)}
  .lock:focus-visible{outline:2px solid var(--c);outline-offset:-10px;border-radius:26px}
  .lock{border-radius:26px}
  .lock.opening .shackle{transform:translateY(-14px)}
  .lock.gone{opacity:0;pointer-events:none}
  .lock.gone .body{transform:scale(.7) translateY(-12px)}

  /* ---------- progress + hint ---------- */
  .pips{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:5px;
    pointer-events:none}
  .pips i{width:3px;height:12px;border-radius:99px;background:#2b3a46;transition:background .3s,height .3s}
  .pips i.on{background:var(--c);height:22px}
  .hint{position:fixed;inset-inline:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:26;text-align:center;
    font-size:12px;color:#7f94a1;pointer-events:none;transition:opacity .5s}
  .hint.hide{opacity:0}

  .end{height:100%;scroll-snap-align:center;display:grid;place-items:center;text-align:center;padding:0 24px;gap:6px}
  .end h2{margin:0;font-family:"Unbounded","Heebo",sans-serif;font-size:22px;font-weight:600}
  .end p{margin:0;color:var(--dim);font-size:13px}
  .end .sig{margin-top:10px;direction:ltr;color:#b9c8d1;font-size:13px;letter-spacing:.05em}
  .end .sig span{font-family:"Unbounded","Heebo",sans-serif;font-weight:600;color:#fff}

  @media (prefers-reduced-motion:reduce){
    .feed{scroll-behavior:auto}
    .card,.acts,.lock,.lock .body,.flip{transition:none}
  }
</style>

].filter(c => c.files.length);   // indicators with no cards today stay out of the feed
const FREE = 3; // first cards of each indicator open without a lock

const LOCK_SVG = `<svg viewBox="0 0 200 250" aria-hidden="true">
  <g class="shackle"><path d="M52 118 V70 a48 48 0 0 1 96 0 V118" fill="none" stroke="url(#lkS)" stroke-width="20"/></g>
  <rect x="14" y="110" width="172" height="136" rx="12" fill="url(#lkB)"/>
  <rect x="14" y="110" width="172" height="136" rx="12" fill="url(#lkBr)"/>
  <rect x="14" y="110" width="172" height="136" rx="12" fill="url(#lkT)"/>
  <path d="M100 150 a17 17 0 0 1 9 31.5 L116 214 H84 L91 181.5 A17 17 0 0 1 100 150Z" fill="#26282b" stroke="#6d7175" stroke-width="1.5"/>
</svg>`;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const feed = document.getElementById("feed");
const tabs = document.getElementById("tabs");
const pips = document.getElementById("pips");
const stamp = document.getElementById("stamp");
const hint = document.getElementById("hint");

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let opened = store.get("velora.opened", []);

const ITEMS = [];
// files: [name, target %], lowest target first — same order as the card wheel
CATS.forEach(cat => cat.files.forEach(([f, target], i) => {
  const [sym, , price] = f.split("_");
  ITEMS.push({ base:f, sym, price, target, cat, locked: i >= FREE && !opened.includes(f) });
}));

// Revolving-door flip: every swipe right adds +180° around the vertical axis,
// so the card always keeps turning the same way (swipe left turns it back the other way).
function makeFlipper(card, flip, it){
  let angle = 0, startX = 0, startY = 0, dx = 0, tracking = false, horizontal = null, justDragged = false;
  // a swipe must not also count as a tap on the card
  card.addEventListener("click", e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  const W = () => card.offsetWidth || 300;
  const faces = flip.querySelectorAll(".face");
  function paint(a, animate){
    flip.classList.toggle("drag", !animate);
    flip.style.transform = `rotateY(${a}deg)`;
    // shade the faces as they go edge-on, like light falling off a turning door
    const edge = Math.abs(Math.sin(a * Math.PI / 180));
    faces.forEach(f => f.style.setProperty("--shade", animate ? 0 : (edge * .55).toFixed(3)));
    const showingBack = Math.round(a / 180) % 2 !== 0;
    card.classList.toggle("flipped", showingBack);
  }
  function turn(dir){
    if (it.locked) return;
    angle += 180 * dir;
    paint(angle, true);
    hint.classList.add("hide");
  }
  card.addEventListener("pointerdown", e => {
    if (it.locked || e.target.closest("button")) return;
    tracking = true; horizontal = null; dx = 0;
    startX = e.clientX; startY = e.clientY;
  });
  card.addEventListener("pointermove", e => {
    if (!tracking) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if (horizontal === null && Math.hypot(mx, my) > 8) {
      horizontal = Math.abs(mx) > Math.abs(my) * 1.2;
      if (horizontal) card.setPointerCapture(e.pointerId); else tracking = false;
    }
    if (!horizontal) return;
    dx = mx;
    // the card follows the finger, up to a half turn
    paint(angle + Math.max(-180, Math.min(180, dx / W() * 200)), false);
  });
  const release = () => {
    if (!tracking) return;
    tracking = false;
    if (!horizontal) return;
    justDragged = true; setTimeout(() => justDragged = false, 0);
    if (Math.abs(dx) > W() * .18) turn(dx > 0 ? 1 : -1);
    else paint(angle, true);     // not far enough: swing back
  };
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", () => { if (tracking && horizontal) paint(angle, true); tracking = false; });
  return turn;
}

const slides = ITEMS.map((it, n) => {
  const s = document.createElement("section");
  s.className = "slide";
  s.style.setProperty("--c", it.cat.color);
  s.dataset.n = n;
  const eager = n < 3 ? "eager" : "lazy";
  s.innerHTML = `
    <div class="glow" aria-hidden="true"></div>
    <figure class="card${it.locked ? " locked" : ""}" style="margin:0">
      <div class="sides" aria-hidden="true"><span class="g">גרף</span><span class="t">טקסט</span></div>
      <div class="acts">
        <button class="turn" aria-label="הפיכת הכרטיס של ${it.sym}">↻</button>
      </div>
      <div class="flip">
        <div class="face front">
          <img src="../img/${it.base}_card.webp" alt="גרף ${it.sym}" width="1170" height="2340" loading="${eager}" decoding="async" draggable="false">
        </div>
        <div class="face back">
          <img src="../img/${it.base}_info.webp" alt="ניתוח טקסט של ${it.sym}" width="1170" height="2340" loading="${eager}" decoding="async" draggable="false">
        </div>
      </div>
    </figure>`;
  const card = s.querySelector(".card");
  const turn = makeFlipper(card, s.querySelector(".flip"), it);
  s.querySelector(".turn").onclick = () => turn(1);
  s.turn = turn;

  // A double tap saves the stock to the favorites. On the back (plain text on white)
  // a single tap turns the card back to the chart, after a beat so a double tap can win.
  let tapT = 0, tapTimer = null;
  s.querySelector(".flip").addEventListener("click", e => {
    if (it.locked || e.target.closest(".lock")) return;
    const now = performance.now();
    if (now - tapT < 320) { tapT = 0; clearTimeout(tapTimer); Favs.toggle(it.sym, card); return; }
    tapT = now;
    if (card.classList.contains("flipped")) tapTimer = setTimeout(() => turn(1), 300);
  });
  if (it.locked) {
    const b = document.createElement("button");
    b.className = "lock";
    b.setAttribute("aria-label", "פתיחת הכרטיס של " + it.sym);
    b.innerHTML = `<div class="body">${LOCK_SVG}</div><span class="say">הקישו לפתיחת ${it.sym}</span>`;
    // only a tap opens the lock — a swipe that starts on it must not
    let downX = 0, downY = 0;
    b.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; });
    b.onclick = e => {
      if (e.detail && Math.hypot(e.clientX - downX, e.clientY - downY) > 10) return;
      b.classList.add("opening");
      setTimeout(() => { b.classList.add("gone"); card.classList.remove("locked"); }, reduce ? 0 : 320);
      setTimeout(() => b.remove(), reduce ? 0 : 900);
      it.locked = false;
      opened = [...new Set([...opened, it.base])];
      store.set("velora.opened", opened);
    };
    s.querySelector(".front").appendChild(b);
  }
  feed.appendChild(s);
  const pip = document.createElement("i");
  pips.appendChild(pip);
  return { el:s, pip, it };
});

const end = document.createElement("section");
end.className = "end";
end.innerHTML = `<h2>סוף הפיד</h2><p>${ITEMS.length} מניות · ${CATS.length} אינדיקטורים · סריקת ${DATE}</p>
  <p class="sig">© <span>Eldar &amp; Elazar</span></p>`;
feed.appendChild(end);

const tabBtns = CATS.map(cat => {
  const b = document.createElement("button");
  b.style.setProperty("--tc", cat.color);
  b.innerHTML = `<span class="sw"></span>${cat.label} <span style="opacity:.6">${cat.files.length}</span>`;
  b.onclick = () => {
    const first = slides.findIndex(s => s.it.cat === cat);
    slides[first].el.scrollIntoView({ block:"center", behavior: reduce ? "auto" : "smooth" });
  };
  tabs.appendChild(b);
  return b;
});

let current = -1;
function setActive(n){
  if (n === current) return;
  current = n;
  slides.forEach((s, i) => {
    s.el.classList.toggle("live", i === n);
    s.pip.classList.toggle("on", i === n);
  });
  const it = slides[n].it;
  tabBtns.forEach((b, i) => b.setAttribute("aria-current", CATS[i] === it.cat));
  stamp.textContent = `${DATE} · 1D · ${n + 1}/${ITEMS.length}`;
  document.documentElement.style.setProperty("--c", it.cat.color);
  tabBtns[CATS.indexOf(it.cat)].scrollIntoView({ block:"nearest", inline:"center", behavior: reduce ? "auto" : "smooth" });
}

const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > .55) setActive(+e.target.dataset.n); });
}, { root: feed, threshold:[.56, .8] });
slides.forEach(s => io.observe(s.el));
setActive(0);

feed.addEventListener("scroll", () => hint.classList.add("hide"), { once:true, passive:true });
// Trackpad: a two-finger sideways swipe flips the card on screen.
// Fingers moving right (deltaX < 0) turn it right, same as a touch swipe.
// One flip per gesture — the flip stays armed off until the trackpad goes quiet,
// so the momentum tail of the same swipe doesn't flip it back.
let wheelAcc = 0, wheelSpent = false, wheelQuiet = null;
feed.addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();                       // also stops the browser's back/forward swipe
  clearTimeout(wheelQuiet);
  wheelQuiet = setTimeout(() => { wheelAcc = 0; wheelSpent = false; }, 220);
  if (wheelSpent) return;
  wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 40) {
    wheelSpent = true;
    slides[current].el.turn(wheelAcc < 0 ? 1 : -1);
  }
}, { passive:false });

feed.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    slides[current].el.turn(e.key === "ArrowRight" ? 1 : -1);
    return;
  }
  const step = e.key === "ArrowDown" || e.key === "PageDown" ? 1 : (e.key === "ArrowUp" || e.key === "PageUp" ? -1 : 0);
  if (!step) return;
  e.preventDefault();
  const n = Math.min(slides.length - 1, Math.max(0, current + step));
  slides[n].el.scrollIntoView({ block:"center", behavior: reduce ? "auto" : "smooth" });
});
</script>
